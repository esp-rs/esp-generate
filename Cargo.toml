[package]
name         = "esp-generate"
version      = "1.4.0"
edition      = "2024"
rust-version = "1.86"
description  = "Template generation tool to create no_std applications targeting Espressif's chips"
repository   = "https://github.com/esp-rs/esp-generate"
license      = "MIT OR Apache-2.0"
keywords     = ["esp32", "template"]
categories   = ["command-line-utilities", "template-engine"]

include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "src",
    "template",
]

[features]
default = ["update-informer"]
update-informer = ["dep:update-informer"]

[dependencies]
anyhow          = "1.0.104"
strum           = { version = "0.28.0", features = ["derive"] }
inquire         = "0.9.4"
clap            = { version = "4.6.7", features = ["derive"] }
env_logger      = "0.11.11"
esp-metadata-generated = { version = "0.5.3", features = ["build-script"] }
log             = "0.4.34"
# Ratatui 0.30.0 has a bug in the TUI display for Windows, we are using the older version until it is fixed.
# For more details: https://github.com/esp-rs/esp-generate/issues/309
ratatui         = { version = "0.29.0", features = ["crossterm", "unstable"] }
somni-expr      = "0.3.2"
taplo           = "0.14.0"
update-informer = { version = "1.3.0", optional = true }
serde           = { version = "1.0.229", features = ["derive"] }
serde_yaml      = "0.9.33"
toml_edit       = "0.25.15+spec-1.1.0"
indexmap = { version = "2.14.2", features = ["serde"] }

[build-dependencies]
quote   = "1.0.47"
walkdir = "2.5.0"
