[workspace]
members = ["esp-template-plugin-chip", "esp-template-sdk", "xtask"]

[workspace.dependencies]
anyhow     = "1.0.104"
clap       = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
indexmap   = { version = "2.14.2", features = ["serde"] }
log        = "0.4.34"
semver     = { version = "1.0.28", features = ["serde"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.33"

[package]
name         = "esp-generate"
version      = "1.4.0"
edition      = "2024"
rust-version = "1.86"
description  = "Template generation tool to create no_std applications targeting Espressif's chips"
repository   = "https://github.com/esp-rs/esp-generate"
license      = "MIT OR Apache-2.0"
keywords     = ["esp32", "template"]
categories   = ["command-line-utilities", "template-engine"]

include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "src",
    "template",
]

[features]
default = ["update-informer"]
update-informer = ["dep:update-informer"]

[dependencies]
esp-template-sdk = { version = "0.1.0", path = "esp-template-sdk"  }
esp-template-plugin-chip = { version = "0.5.0", path = "esp-template-plugin-chip" }
anyhow.workspace = true
strum           = { version = "0.28.0", features = ["derive"] }
inquire         = "0.9.4"
clap.workspace = true
env_logger.workspace = true
log.workspace = true
# Ratatui 0.30.0 has a bug in the TUI display for Windows, we are using the older version until it is fixed.
# For more details: https://github.com/esp-rs/esp-generate/issues/309
ratatui         = { version = "0.29.0", features = ["crossterm", "unstable"] }
semver.workspace = true
taplo           = "0.14.0"
update-informer = { version = "1.3.0", optional = true }
serde.workspace = true
serde_yaml.workspace = true
toml_edit       = { version = "0.25.15+spec-1.1.0", features = ["serde"] }
walkdir         = "2.5.0"
tempfile        = "3.23.0"
indexmap.workspace = true

[build-dependencies]
quote   = "1.0.47"
walkdir = "2.5.0"
