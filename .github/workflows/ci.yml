name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/README.md"
  merge_group:
  schedule:
    - cron: "34 2 * * *"
  workflow_dispatch:
    inputs:
      build:
        description: "Fully build the tested configurations"
        required: true
        type: boolean
      all_combinations:
        description: "Checks all combinations of options"
        required: true
        type: boolean

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MSRV: "1.86"
  SSID: ""
  PASSWORD: ""

# Cancel any currently running workflows from the same PR, branch, or
# tag when a new workflow is triggered.
#
# https://stackoverflow.com/a/66336834
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  # --------------------------------------------------------------------------
  # Verify

  verify:
    name: "Check ${{ matrix.chip }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32c2, esp32c3, esp32c6, esp32c5, esp32c61, esp32h2, esp32s2, esp32s3]

    steps:
      - uses: actions/checkout@v6

      # Rust toolchain for Xtensa:
      - if: ${{ contains(fromJson('["esp32", "esp32s2", "esp32s3"]'), matrix.chip) }}
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: ${{ matrix.chip }}
          ldproxy: false

      # Rust toolchain for RISC-V:
      - if: ${{ !contains(fromJson('["esp32", "esp32s2", "esp32s3"]'), matrix.chip) }}
        uses: dtolnay/rust-toolchain@stable
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
          components: clippy,rustfmt,rust-src

      # Rust toolchain for RISC-V:
      - if: ${{ !contains(fromJson('["esp32", "esp32s2", "esp32s3"]'), matrix.chip) }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
          components: clippy,rustfmt,rust-src

      # //Define a new environment variable called toolchain
      - if: ${{ contains(fromJson('["esp32", "esp32s2", "esp32s3"]'), matrix.chip) }}
        run: echo "TOOLCHAIN=+esp" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Generate and check project
        run: cargo ${{ env.TOOLCHAIN }} xtask check ${{ matrix.chip }} ${{ fromJSON('["", "--all-combinations"]')[inputs.all_combinations || github.event_name == 'schedule'] }} ${{ fromJSON('["", "--build"]')[inputs.build || github.event_name == 'schedule'] }}

      - if: github.event_name == 'schedule'
        name: Run cargo-package
        run: cargo package --allow-dirty


  # --------------------------------------------------------------------------
  # Test

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

  # --------------------------------------------------------------------------
  # Lint

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # --------------------------------------------------------------------------
  # MSRV

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MSRV }}
      - run: cargo check -p esp-generate

  # --------------------------------------------------------------------------
  # Scheduled failure reporting

  report-scheduled-failure:
    if: ${{ github.event_name == 'schedule' && always() && (needs.verify.result == 'failure' || needs.test.result == 'failure' || needs.clippy.result == 'failure' || needs.msrv.result == 'failure') }}
    needs: [verify, test, clippy, msrv]
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create or update GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search '"Scheduled CI Failure" in:title' \
            --limit 1 \
            --json number \
            --jq '.[0].number')

          BODY="Scheduled CI workflow failed. [View the failed run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create \
              --title "Scheduled CI Failure" \
              --body "$BODY"
          fi
