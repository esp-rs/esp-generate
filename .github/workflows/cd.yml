name: Continuous Deployment

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish-artifacts:
    name: Generating artifacts for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-postfix: ".exe"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Publish (dry-run)
        if: matrix.job.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release
          cargo publish --workspace --dry-run --allow-dirty
      - name: Install cross and build
        if: matrix.job.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo install cross
          cross build --release --target ${{ matrix.job.target }}
      - name: Cargo build
        if: matrix.job.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.job.target }}
      - name: Compress (Unix)
        if: ${{ matrix.job.os != 'windows-latest' }}
        run: zip -j esp-generate-${{ matrix.job.target }}.zip target/${{ matrix.job.target }}/release/esp-generate${{ matrix.job.binary-postfix }}
      - name: Compress (Windows)
        if: ${{ matrix.job.os == 'windows-latest' }}
        run: Compress-Archive target/${{ matrix.job.target }}/release/esp-generate${{ matrix.job.binary-postfix }} esp-generate-${{ matrix.job.target }}.zip
      - name: Upload compressed artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: esp-generate-${{ matrix.job.target }}.zip
          tag: ${{ github.ref }}
      - name: Upload binary artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.job.target }}/release/esp-generate${{ matrix.job.binary-postfix }}
          asset_name: esp-generate-${{ matrix.job.target }}${{ matrix.job.binary-postfix }}
          tag: ${{ github.ref }}
  publish-cratesio:
    name: Publishing to Crates.io
    needs: publish-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
        run: |
          cargo build --release
          # Dependency order; crate versions that were not bumped for this release are already published
          for crate in esp-template-sdk esp-template-plugin-chip esp-generate; do
            version=$(cargo metadata --format-version 1 --no-deps | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if curl -sf -A "esp-generate-cd (https://github.com/esp-rs/esp-generate)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already published, skipping"
            else
              cargo publish -p "$crate" --allow-dirty
            fi
          done
